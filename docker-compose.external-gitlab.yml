# =============================================================================
# External GitLab override
# ─────────────────────────────────────────────────────────────────────────────
# 이미 회사/조직에 운영 중인 GitLab을 재사용해 ZENITH ITSM을 설치할 때 사용한다.
# 번들 GitLab 컨테이너를 기동하지 않고, 외부 GitLab API URL을 환경변수로 지정.
#
# 사용법:
#   cp .env.example .env  (또는 make install-external)
#   # .env에 GITLAB_API_URL, GITLAB_EXTERNAL_URL, OAuth/토큰 값 세팅
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.external-gitlab.yml \
#     up -d
#
# 환경변수 요구사항 (.env):
#   - GITLAB_API_URL        컨테이너에서 접근할 GitLab URL (예: https://gitlab.corp)
#   - GITLAB_EXTERNAL_URL   브라우저에서 접근할 GitLab URL (동일할 수도, 다를 수도)
#   - GITLAB_OAUTH_REDIRECT_URI  OAuth 콜백 URL
#   - GITLAB_OAUTH_CLIENT_ID/SECRET
#   - GITLAB_PROJECT_TOKEN  ITSM 전용 GitLab 프로젝트 액세스 토큰
#   - GITLAB_PROJECT_ID     연동할 GitLab 프로젝트 ID
#   - GITLAB_WEBHOOK_SECRET GitLab → ITSM 웹훅 검증 시크릿
#
# 내부 DNS로 도달 불가한 사설 GitLab(예: Linux 호스트의 `host.docker.internal`
# 미지원 환경)이면 네트워크 설정을 `network_mode: host`로 바꾸거나 `extra_hosts`
# 블록을 이용해 호스트 IP를 등록한다. 아래 `itsm-api`의 `extra_hosts` 예시 참조.
# =============================================================================

services:
  # 번들 GitLab 컨테이너 비활성화 — replicas=0으로 실제 기동하지 않음.
  # 완전 제거를 원하면 `docker compose rm -f gitlab` 후 이 override만 사용.
  gitlab:
    profiles: ["never"]          # 어떤 프로필로도 기동되지 않도록 고립
    restart: "no"
    deploy:
      replicas: 0

  # API 컨테이너에서 외부 GitLab으로 DNS 해석이 안 될 때
  # 호스트명 → IP 매핑을 수동 주입할 수 있도록 extra_hosts 예시 포함.
  # 실제 사용 시 `.env`의 `GITLAB_EXTRA_HOST` (형식: "hostname:ip") 변수로 전달.
  itsm-api:
    extra_hosts:
      # 예: gitlab.corp:10.0.1.42 — Linux 호스트 네트워크 브릿지 미지원 시 유용
      # docker-compose v2는 환경변수로 extra_hosts를 주입할 수 없어 주석 템플릿만 제공.
      # 필요 시 이 섹션에 "hostname:ip" 라인을 직접 추가.
      - "host.docker.internal:host-gateway"   # macOS/Windows 기본, Linux는 host-gateway 지원

  celery-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-beat:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 프론트엔드는 브라우저가 직접 GitLab URL을 열기 때문에 컨테이너 extra_hosts 불필요.
  # (NEXT_PUBLIC_GITLAB_URL이 공인 도메인이면 그대로 사용.)
