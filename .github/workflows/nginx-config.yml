name: nginx config validation

on:
  pull_request:
    paths:
      - 'nginx/**'
  push:
    branches: [main]
    paths:
      - 'nginx/**'

jobs:
  nginx-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render template & run nginx -t
        run: |
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -e NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/templates \
            -e NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d \
            nginx:1.27-alpine sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
